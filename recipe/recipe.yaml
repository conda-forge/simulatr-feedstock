schema_version: 1

context:
  version: "0.1.0"

package:
  name: simulatr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/simulatr/simulatr-${{ version }}.tar.gz
  sha256: 7291e4cc1de77a0a2035ac16fba11608614fd0ea310dd898162a059f090f37b2

build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation -vv .
  python:
    entry_points:
      - simulatr = simulatr.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
    - wheel
  run:
    - python >=${{ python_min }}
    - dotnet >=8.0.0,<9.0.0
    - fastapi
    - gtk3
    - gymnasium
    - msgpack-python
    - numpy
    - pandas
    - psutil
    - pydantic
    - pydantic-settings
    - pyzmq
    - requests

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - simulatr
        - simulatr.apsimx
        - simulatr.cli
        - simulatr.utils
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - simulatr --help

about:
  homepage: https://github.com/langmm/simulatr
  repository: https://github.com/langmm/simulatr
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Gym environment for reinforcement learning using process-based simulators
  description: |
    Gym environment for reinforcement learning using process-based
    simulators like crop growth models.
  documentation: https://langmm.github.io/simulatr

extra:
  recipe-maintainers:
    - langmm
